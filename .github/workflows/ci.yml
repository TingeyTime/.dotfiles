name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x install.sh bash/*.sh
      - name: stylua
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.3.1
          args: --check nvim/
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.23.0 -Scope CurrentUser -Force
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Get-ChildItem -Recurse -Include *.ps1 -Exclude *.Tests.ps1 |
            ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Settings ./PSScriptAnalyzerSettings.psd1 }
          $results | Format-Table -AutoSize
          if ($results) { exit 1 }

  powershell:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        # Windows ships Pester 3, signed by a different publisher
        run: Install-Module Pester -RequiredVersion 5.6.1 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Profile tests
        run: |
          Import-Module Pester -RequiredVersion 5.6.1
          Invoke-Pester powershell/test -CI -Output Detailed

  install:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run install.sh twice in a fresh home
        run: |
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME/.config/nvim"
          touch "$HOME/.bashrc"
          ./install.sh
          ./install.sh
      - name: Verify links, backup, and bashrc hook
        run: |
          HOME="$RUNNER_TEMP/home"
          for pkg in bash git nvim powershell starship tmux; do
            test "$(readlink "$HOME/.config/$pkg")" = "$PWD/$pkg"
          done
          ls -d "$HOME"/.config/nvim.backup.*
          test "$(grep -c 'bash/bashrc.sh' "$HOME/.bashrc")" -eq 1
      - name: Uninstall, then install a subset
        run: |
          export HOME="$RUNNER_TEMP/home"
          ./install.sh --uninstall
          for pkg in bash git nvim powershell starship tmux; do
            test ! -e "$HOME/.config/$pkg"
          done
          if grep -q 'bash/bashrc.sh' "$HOME/.bashrc"; then exit 1; fi
          ./install.sh git nvim
          test -L "$HOME/.config/git" && test -L "$HOME/.config/nvim"
          test ! -e "$HOME/.config/tmux"

  nvim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Link config and install locked plugins
        run: |
          mkdir -p ~/.config
          ln -s "$PWD/nvim" ~/.config/nvim
          nvim --headless "+Lazy! restore" +qa
      - name: Smoke test
        run: nvim --headless -c "luafile nvim/test/smoke.lua"
