##### General #####

set -g default-terminal "tmux-256color"
set -ag terminal-features ",xterm-256color:RGB"

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Closing the last window in a session switches sessions instead of detaching
set -g detach-on-destroy off
set -g status-position top

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# New splits open in the current pane's directory
bind '%' split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"


##### Navigation #####

# Vim motions for pane selection
setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Arrow keys resize panes
bind -r Up resize-pane -U 5
bind -r Down resize-pane -D 5
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5

bind b previous-window

# Shift-Alt vim keys switch windows without the prefix
bind -n M-H previous-window
bind -n M-L next-window


##### Popups #####

bind C-y display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "lazygit"
bind C-t display-popup -d "#{pane_current_path}" -E "bash"
bind C-p display-popup -E "ipython"
bind C-n display-popup -E 'bash -c "read -p \"Session name: \" name && tmux new-session -d -s \"\$name\" && tmux switch-client -t \"\$name\""'
bind C-j display-popup -E "tmux list-sessions | sed -E 's/:.*//' | grep -vx \"\$(tmux display-message -p '#S')\" | fzf --reverse | xargs -r tmux switch-client -t"

bind d display-menu -T "#[align=centre]Dotfiles" -x C -y C \
  "tmux.conf"   t "display-popup -w 80% -h 80% -E 'nvim ~/.config/tmux/tmux.conf'" \
  "aliases.sh"  a "display-popup -w 80% -h 80% -E 'nvim ~/.config/bash/aliases.sh'" \
  "nvim"        n "display-popup -w 80% -h 80% -d ~/.config/nvim -E 'nvim .'" \
  "Exit"        q ""


##### Theme (catppuccin/tmux v2) #####

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W#{?window_zoomed_flag, (),}"
set -g @catppuccin_date_time_text " %H:%M"

# Load the theme before the status line references its modules
run '~/.config/tmux/plugins/tmux/catppuccin.tmux'

set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_date_time}"


##### Plugins #####

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.3.2'

# Initialize TPM (keep this line at the very bottom)
run '~/.config/tmux/plugins/tpm/tpm'
